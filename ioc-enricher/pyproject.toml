[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-enricher"
version = "0.1.0"
description = "Enrich IOCs (IPs, domains, URLs, hashes) against AbuseIPDB, VirusTotal, and urlscan.io in one report."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
ioc-enricher = "ioc_enricher.cli:main"

[tool.setuptools.packages.find]
include = ["ioc_enricher*"]
